{% extends "auth_base.html" %}
{% block title %}Update password · Pingwatch{% endblock %}
{% block heading %}
<h1 data-i18n="auth.update_password">Update your password</h1>
<p class="lede" data-i18n="auth.update_password_lede">Set a new password to continue</p>
{% endblock %}
{% block content %}
<form id="password-form">
  <label><span data-i18n="auth.current_password">Current password</span><input name="current_password" type="password" required autocomplete="current-password" placeholder="••••••••" /></label>
  <label><span data-i18n="auth.new_password">New password</span><input name="new_password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••" /></label>
  <p class="form-error" id="form-error" hidden></p>
  <button class="primary" type="submit" data-i18n="auth.save_password">Save password</button>
</form>
{% endblock %}
{% block scripts %}
<script src="/static/js/password.js?v=7"></script>
{% endblock %}
